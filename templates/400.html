{% extends "base.html" %}

{% block content %}
<div class="container d-flex flex-column align-items-center justify-content-center min-vh-75">
    <div class="glass-card text-center p-5 animate-fade-in">
        <h1 class="display-1 text-primary fw-bold">400</h1>
        <h2 class="h4 mb-4">Request could not be processed</h2>
        <p class="text-muted mb-4">{{ reason or "Your session may have expired. Go back, reload the page and try again." }}</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
            <i class="fas fa-home me-2"></i>Return Home
        </a>
    </div>
</div>
{% endblock %}

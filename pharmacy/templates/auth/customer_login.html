{% extends "base.html" %}
{% from "_form.html" import csrf %}
{% block title %}Customer sign in{% endblock %}
{% block public_content %}
<div class="panel mx-auto my-4" style="max-width: 420px">
  <h1 class="h4">Customer sign in</h1>
  <form method="post" class="mt-3">
    {{ csrf() }}
    <div class="mb-3">
      <label class="form-label" for="customer_id">Customer ID</label>
      <input class="form-control" id="customer_id" name="customer_id" value="{{ customer_id }}" inputmode="numeric" pattern="[0-9]*" required autofocus>
      <div class="form-text">Printed on your bill.</div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn-primary w-100" type="submit">Sign in</button>
  </form>
  <p class="small text-body-secondary mt-3 mb-0">No password yet? Ask at the counter to set one up.</p>
</div>
{% endblock %}

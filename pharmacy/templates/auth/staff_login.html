{% extends "base.html" %}
{% from "_form.html" import csrf %}
{% block title %}Staff sign in{% endblock %}
{% block public_content %}
<div class="panel mx-auto my-4" style="max-width: 420px">
  <h1 class="h4">Staff sign in</h1>
  <form method="post" class="mt-3">
    {{ csrf() }}
    <div class="mb-3">
      <label class="form-label" for="username">Username</label>
      <input class="form-control" id="username" name="username" value="{{ username }}" autocomplete="username" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn-primary w-100" type="submit">Sign in</button>
  </form>
  <p class="small text-body-secondary mt-3 mb-0">Forgotten your password? Ask the store admin to set a new one.</p>
</div>
{% endblock %}
